<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cattle">
  <title>Cattle Logbook</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/app.css?v=9">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <button type="button" class="back" id="back" hidden aria-label="Back">‹</button>
        <div class="brand">
          <img src="./icons/icon-192.png" alt="" width="36" height="36">
          <div>
            <h1 id="title">Cattle Logbook</h1>
            <p class="sub" id="subtitle">Opening the book…</p>
          </div>
        </div>
      </div>
    </header>
    <main id="main">
      <div class="screen"><div class="body"><p class="hint">Opening the book…</p></div></div>
    </main>
  </div>
  <div id="toast" hidden role="status"></div>
  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
  <script type="module" src="./js/app.mjs?v=9"></script>
</body>
</html>
